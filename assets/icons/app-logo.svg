<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Deep Space Field -->
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1338"/>
      <stop offset="55%" stop-color="#0c081d"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>

    <!-- Metallic Auric Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="goldInnerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Spiritual Violet Aspiration Gradient -->
    <linearGradient id="lotusViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#e879f9"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filters for 3D Elevation -->
    <filter id="divineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="goldenDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#fbbf24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Circular Maskable Base / Background (Squircle & Circle Friendly for iOS & Android) -->
  <circle cx="256" cy="256" r="246" fill="url(#spaceGradient)"/>

  <!-- 2. Sacred Concentric Rings (Double Rim of Speech & Silence) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45"/>

  <!-- 3. The 12 Rays of Light (12 Soul Qualities Radiating from Core) -->
  <g stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.35">
    <line x1="256" y1="20" x2="256" y2="492"/>
    <line x1="20" y1="256" x2="492" y2="256"/>
    <line x1="89" y1="89" x2="423" y2="423"/>
    <line x1="89" y1="423" x2="423" y2="89"/>
    <line x1="43" y1="166" x2="469" y2="346"/>
    <line x1="43" y1="346" x2="469" y2="166"/>
  </g>

  <!-- 4. Sacred 12-Petaled Base Mandala Blossom (Spiritual Purity & Speech Mastery) -->
  <g filter="url(#goldenDrop)" transform="translate(256, 310)">
    <!-- Bottom Petal Outlines (Base Lotus) -->
    <path d="M0,45 C-45,20 -70,-20 -75,-60 C-40,-55 -15,-30 0,0 C15,-30 40,-55 75,-60 C70,-20 45,20 0,45 Z" fill="url(#lotusViolet)" opacity="0.75"/>
    <path d="M-60,30 C-95,0 -115,-35 -110,-75 C-80,-60 -50,-35 -35,5 Z" fill="url(#lotusViolet)" opacity="0.55"/>
    <path d="M60,30 C95,0 115,-35 110,-75 C80,-60 50,-35 35,5 Z" fill="url(#lotusViolet)" opacity="0.55"/>
    <path d="M0,50 C-30,25 -50,-5 -45,-40 C-20,-30 0,-10 0,0 C0,-10 20,-30 45,-40 C50,-5 30,25 0,50 Z" fill="url(#goldInnerGlow)" opacity="0.85"/>
  </g>

  <!-- 5. Central Majestic Glyph: 'V' for VAK (The Divine Word / Sacred Speech) -->
  <!-- Designed with Classical Roman Lapidary Proportion & Golden Bevels -->
  <g filter="url(#goldenDrop)">
    <!-- Stylized V Glyph Shaped as Rising Wings / Flame of Aspiration -->
    <path d="M125,120 
             L168,120 
             L256,338 
             L344,120 
             L387,120 
             L282,376 
             C275,392 267,400 256,400 
             C245,400 237,392 230,376 
             Z" 
          fill="url(#goldGradient)"/>

    <!-- Left Seraph Cutout / Serif Detail -->
    <path d="M110,120 L180,120 L180,132 L148,132 L110,120 Z" fill="url(#goldGradient)" opacity="0.8"/>
    <!-- Right Seraph Cutout / Serif Detail -->
    <path d="M402,120 L332,120 L332,132 L364,132 L402,120 Z" fill="url(#goldGradient)" opacity="0.8"/>

    <!-- Inner Core Golden Inlay Reflecting Sacred Light -->
    <path d="M152,142 
             L170,142 
             L256,350 
             L342,142 
             L360,142 
             L265,372 
             C260,380 252,380 247,372 
             Z" 
          fill="url(#goldInnerGlow)" opacity="0.5"/>
  </g>

  <!-- 6. Central Sun / Star of Consciousness (Bindu) -->
  <circle cx="256" cy="180" r="16" fill="url(#goldGradient)" filter="url(#divineGlow)"/>
  <circle cx="256" cy="180" r="7" fill="#ffffff"/>
  
  <!-- Subtle Spark of Light -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.9">
    <line x1="256" y1="154" x2="256" y2="206"/>
    <line x1="230" y1="180" x2="282" y2="180"/>
  </g>

  <!-- 7. Bottom Arc Accent: "VAK" Micro-Inscription in Sacred Cinzel Tone -->
  <text x="256" y="458" 
        font-family="'Cinzel', serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="12" 
        fill="url(#goldGradient)" 
        text-anchor="middle" 
        filter="url(#goldenDrop)">
    VAK
  </text>
</svg>
